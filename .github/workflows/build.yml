name: Build & Release

on:
  push:
    branches: [main]      # change to master if that's your branch name
  workflow_dispatch:      # lets you also run it manually from the Actions tab

permissions:
  contents: write         # needed to create/update releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/CombatCore-*.jar \
            --title "CombatCore (latest build)" \
            --notes "Automatic build of commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
